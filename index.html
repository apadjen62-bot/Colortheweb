<!DOCTYPE html>
<html>
<head>
    <title>Peachy Pink Color Scheme</title>
</head>
<body style="font-family: Arial, sans-serif;">

    <table border="1"
           style="width: 100%; text-align: center;
                  border-collapse: collapse;">

        <tr>
            <th colspan="4"
                style="background-color: #F08080;
                       color: white;
                       font-size: 28px;
                       padding: 15px;">
                Peachy Pink Color Scheme
            </th>
        </tr>

        <tr>
            <td style="background-color: #FFC0CB;">Pink</td>
            <td style="background-color: #FFDAB9;">Peach</td>
            <td style="background-color: #FFFDD0;">Cream</td>
            <td style="background-color: #FF7F50;">Coral</td>
        </tr>

        <tr>
            <td>#FFC0CB</td>
            <td>#FFDAB9</td>
            <td>#FFFDD0</td>
            <td>#FF7F50</td>
        </tr>

        <tr>
            <td>rgb(255, 192, 203)</td>
            <td>rgb(255, 218, 185)</td>
            <td>rgb(255, 253, 208)</td>
            <td>rgb(255, 127, 80)</td>
        </tr>

        <tr>
            <td>hsl(350, 100%, 88%)</td>
            <td>hsl(28, 100%, 86%)</td>
            <td>hsl(57, 100%, 91%)</td>
            <td>hsl(16, 100%, 66%)</td>
        </tr>

    </table>

</body>
</html>
